name: Update Behance reels link

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-behance-reels-link.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update link
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          const oldUrl = 'https://www.behance.net/gallery/247470919';
          const newUrl = 'https://www.behance.net/gallery/247470919/Rolki';
          let html = fs.readFileSync(path, 'utf8');
          if (!html.includes(newUrl)) {
            if (!html.includes(oldUrl)) throw new Error('Behance reels link not found');
            html = html.replaceAll(oldUrl, newUrl);
            fs.writeFileSync(path, html);
          }
          NODE
      - name: Commit and publish
        run: |
          rm .github/workflows/update-behance-reels-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-behance-reels-link.yml
          git commit -m "Update Behance reels link"
          git push
