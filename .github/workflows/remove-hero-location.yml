name: Remove hero location

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove location from hero
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let html = fs.readFileSync(path, 'utf8');
          html = html.replace(
            '<div class="hero-eyebrow">Marketing Freelancer &nbsp;·&nbsp; Kraków, Polska</div>',
            '<div class="hero-eyebrow">Marketing Freelancer</div>'
          );
          fs.writeFileSync(path, html);
          NODE
      - name: Commit and publish
        run: |
          rm -f .github/workflows/remove-hero-location.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-hero-location.yml
          git commit -m "Remove location from homepage"
          git push
